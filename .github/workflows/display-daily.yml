name: Display Daily Auto-publish

on:
  schedule:
    - cron: '30 0 * * *'  # 매일 00:30 UTC = 09:30 KST (다이제스트 메일이 09:10경 도착)
  workflow_dispatch: {}    # 수동 실행 버튼(테스트·긴급 재실행용)

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run daily card pipeline
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python _automation/run_daily.py

      - name: Commit and push if changed
        run: |
          git config user.name "nextio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add display-daily/
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 스킵"
          else
            git commit -m "Auto-publish Display Daily [$(date -u +%Y-%m-%d)]"
            git push
          fi
