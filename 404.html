<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>페이지를 찾을 수 없습니다 — Next I/O</title>
<link rel="icon" href="/images/nextio-mark-color.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #050814;
    color: #E8EDF9;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    line-height: 1.6;
  }
  .wrap { width: 100%; max-width: 560px; text-align: center; }
  .logo { width: 168px; height: auto; margin: 0 auto 40px; display: block; }
  .code {
    font-size: 72px;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: #6FA8FF;
    margin: 0;
    line-height: 1;
  }
  h1 { font-size: 22px; font-weight: 700; margin: 20px 0 12px; }
  p { margin: 0; color: #A4B3D6; font-size: 15px; }
  .links {
    margin-top: 36px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }
  .links a {
    display: inline-block;
    padding: 11px 20px;
    border-radius: 999px;
    border: 1px solid rgba(111, 168, 255, 0.35);
    color: #6FA8FF;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: background .15s ease, border-color .15s ease;
  }
  .links a:hover { background: rgba(111, 168, 255, 0.12); border-color: #6FA8FF; }
  .links a.primary { background: #6FA8FF; border-color: #6FA8FF; color: #050814; }
  .links a.primary:hover { background: #8CB8FF; }
  @media (max-width: 480px) {
    .code { font-size: 56px; }
    h1 { font-size: 19px; }
    .logo { width: 140px; margin-bottom: 32px; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="/images/nextio-lockup-reverse.svg" alt="Next I/O">
    <p class="code">404</p>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>주소가 바뀌었거나 삭제된 페이지입니다.<br>아래에서 찾으시는 곳으로 이동해 주세요.</p>
    <nav class="links">
      <a class="primary" href="/">홈으로</a>
      <a href="/display-daily/">디스플레이 데일리</a>
      <a href="/education/unicorn.html">AI 유니콘 과정</a>
      <a href="/#contact">문의하기</a>
    </nav>
  </main>
</body>
</html>
