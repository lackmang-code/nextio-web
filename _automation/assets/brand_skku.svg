<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 46" width="330" height="46" role="img" aria-label="성균관대 첨단디스플레이공학과">
  <g transform="translate(0,12)">
    <rect x="0" y="1" width="26" height="18" rx="2.5" fill="none" stroke="#4ADE80" stroke-width="2.2"/>
    <rect x="4.5" y="5.5" width="17" height="9" rx="1" fill="#4ADE80" opacity=".55"/>
    <rect x="9" y="21.5" width="8" height="2.6" rx="1.3" fill="#4ADE80"/>
  </g>
  <!-- 두 줄 baseline 간격 27px. viewBox 높이(46) 안에서 최대한 벌린 값 —
       더 띄우려면 아래 글자의 descender가 잘리므로 폰트를 줄여야 한다. -->
  <text x="37" y="14" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"
        font-size="10.5" font-weight="600" fill="#a7c4b0" letter-spacing="0.6">성균관대학교</text>
  <text x="37" y="41" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"
        font-size="17.5" font-weight="700" fill="#ffffff" letter-spacing="-0.4">첨단디스플레이공학과</text>
</svg>
