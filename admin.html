<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>문의 게시판 관리자 - Next I/O</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: #0f1117;
    color: #e5e7eb;
    margin: 0;
    padding: 40px 20px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 24px; }
  #loginBox {
    background: #1a1d27;
    border: 1px solid #2a2e3a;
    border-radius: 10px;
    padding: 32px;
    max-width: 360px;
    margin: 60px auto;
  }
  #loginBox label { display: block; margin-bottom: 8px; font-size: 14px; color: #9ca3af; }
  #loginBox input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid #2a2e3a;
    background: #0f1117;
    color: #e5e7eb;
    font-size: 14px;
    margin-bottom: 16px;
  }
  #loginBox button, .replyBtn {
    width: 100%;
    padding: 10px 12px;
    border-radius: 6px;
    border: none;
    background: #2456E6;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  #loginBox button:hover, .replyBtn:hover { background: #1c46c2; }
  #loginError { color: #f87171; font-size: 13px; margin-top: 8px; min-height: 16px; }
  #boardWrap { display: none; }
  .post {
    background: #1a1d27;
    border: 1px solid #2a2e3a;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .post-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
  .post-title { font-size: 16px; font-weight: 600; }
  .post-meta { font-size: 12px; color: #9ca3af; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; margin-left: 6px; }
  .badge.private { background: #7c2d12; color: #fed7aa; }
  .badge.answered { background: #14532d; color: #bbf7d0; }
  .badge.unanswered { background: #3f3f46; color: #d4d4d8; }
  .post-body { font-size: 14px; line-height: 1.6; white-space: pre-wrap; color: #d1d5db; margin: 12px 0; }
  .post-contact { font-size: 12px; color: #9ca3af; margin-bottom: 8px; }
  .reply-existing {
    background: #0f1117;
    border-left: 3px solid #2456E6;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 14px;
    white-space: pre-wrap;
    margin-top: 10px;
    color: #e5e7eb;
  }
  textarea.replyInput {
    width: 100%;
    min-height: 80px;
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid #2a2e3a;
    background: #0f1117;
    color: #e5e7eb;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
  }
  .replyBtn { width: auto; padding: 8px 20px; margin-top: 8px; font-size: 13px; }
  .delBtn {
    width: auto; padding: 8px 16px; margin-top: 8px; margin-left: 8px; font-size: 13px;
    border-radius: 6px; border: 1px solid #5a3030; background: transparent; color: #d98a8a;
    cursor: pointer;
  }
  .delBtn:hover { background: #3a2020; }
  .delBtn.armed { background: #c0392b; border-color: #c0392b; color: #fff; font-weight: 700; }
  .delBtn:disabled { opacity: .6; cursor: default; }
  #emptyMsg { color: #9ca3af; text-align: center; padding: 40px 0; }
  #refreshBtn { background: #2a2e3a; margin-bottom: 16px; width: auto; padding: 8px 16px; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">

  <div id="loginBox">
    <h1 style="margin-top:0;">관리자 로그인</h1>
    <label for="pwInput">비밀번호</label>
    <input type="password" id="pwInput" autocomplete="off">
    <button id="loginBtn">로그인</button>
    <div id="loginError"></div>
  </div>

  <div id="boardWrap">
    <h1>문의 게시판 관리</h1>
    <button id="refreshBtn">새로고침</button>
    <div id="posts"></div>
    <div id="emptyMsg" style="display:none;">등록된 문의가 없습니다.</div>

    <div id="notifyWrap" style="margin-top:44px; border-top:1px solid #2a2e3a; padding-top:26px;">
      <h1 style="font-size:20px;">단행본 출간 알림 신청 <span id="notifyCount" style="color:#d9a441;"></span></h1>
      <p style="font-size:13px; color:#8b93a8; margin:-6px 0 14px;">
        『1인 유니콘 기업 첫발 딛기』 사전 신청 명단입니다. 출간되면 이 주소로 안내를 보냅니다.
      </p>
      <button id="notifyRefreshBtn" style="background:#2a2e3a; width:auto; padding:8px 16px; font-size:13px;">새로고침</button>
      <button id="copyMailsBtn" style="background:#2a2e3a; width:auto; padding:8px 16px; font-size:13px; margin-left:6px;">이메일 전체 복사</button>
      <div id="notifyList" style="margin-top:14px;"></div>
      <div id="notifyEmpty" style="display:none; color:#8b93a8;">아직 신청자가 없습니다.</div>
      <textarea id="mailsBox" readonly
        style="display:none; width:100%; height:120px; margin-top:12px; background:#141821;
               color:#e6e9ef; border:1px solid #2a2e3a; border-radius:6px; padding:10px;
               font-family:ui-monospace,Consolas,monospace; font-size:12.5px;"></textarea>
    </div>
  </div>

</div>

<script>
let ADMIN_PW = '';

const loginBox = document.getElementById('loginBox');
const boardWrap = document.getElementById('boardWrap');
const pwInput = document.getElementById('pwInput');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');
const postsEl = document.getElementById('posts');
const emptyMsg = document.getElementById('emptyMsg');
const refreshBtn = document.getElementById('refreshBtn');

async function login() {
  const pw = pwInput.value;
  if (!pw) return;
  loginError.textContent = '';
  loginBtn.disabled = true;
  loginBtn.textContent = '확인 중...';
  try {
    const res = await fetch('/api/board/admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw, action: 'list' })
    });
    const data = await res.json();
    if (!res.ok || !data.success) {
      loginError.textContent = '비밀번호가 올바르지 않습니다.';
      loginBtn.disabled = false;
      loginBtn.textContent = '로그인';
      return;
    }
    ADMIN_PW = pw;
    loginBox.style.display = 'none';
    boardWrap.style.display = 'block';
    renderPosts(data.posts);
    loadNotify();
  } catch (e) {
    loginError.textContent = '접속 중 오류가 발생했습니다.';
    loginBtn.disabled = false;
    loginBtn.textContent = '로그인';
  }
}

loginBtn.addEventListener('click', login);
pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });

function esc(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : str;
  return div.innerHTML;
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function renderPosts(posts) {
  postsEl.innerHTML = '';
  if (!posts || posts.length === 0) {
    emptyMsg.style.display = 'block';
    return;
  }
  emptyMsg.style.display = 'none';

  posts.forEach((p) => {
    const div = document.createElement('div');
    div.className = 'post';

    const answeredBadge = p.replied_at
      ? '<span class="badge answered">답변완료</span>'
      : '<span class="badge unanswered">미답변</span>';
    const privateBadge = p.is_private ? '<span class="badge private">비공개</span>' : '';

    div.innerHTML = `
      <div class="post-head">
        <div class="post-title">#${p.id} ${esc(p.title)} ${privateBadge}${answeredBadge}</div>
        <div class="post-meta">${fmtDate(p.created_at)}</div>
      </div>
      <div class="post-contact">${esc(p.name)} · ${esc(p.email)}${p.org ? ' · ' + esc(p.org) : ''}${p.service ? ' · 관심서비스: ' + esc(p.service) : ''}</div>
      <div class="post-body">${esc(p.message)}</div>
      ${p.reply ? `<div class="reply-existing"><strong>답변 (${fmtDate(p.replied_at)}):</strong><br>${esc(p.reply)}</div>` : ''}
      <textarea class="replyInput" placeholder="${p.reply ? '답변 수정...' : '답변 작성...'}"${p.reply ? ' style="display:none"' : ''}>${p.reply ? esc(p.reply) : ''}</textarea>
      <button class="replyBtn" data-id="${p.id}">${p.reply ? '답변 수정' : '답변 등록'}</button>
      <button class="delBtn" data-id="${p.id}">삭제</button>
    `;

    postsEl.appendChild(div);
  });

  // 삭제는 두 번 눌러야 실행된다. confirm() 은 쓰지 않는다(자동화 도구가 걸린다).
  postsEl.querySelectorAll('.delBtn').forEach((btn) => {
    let armed = false;
    let timer = null;
    btn.addEventListener('click', async () => {
      if (!armed) {
        armed = true;
        btn.textContent = '한 번 더 누르면 삭제';
        btn.classList.add('armed');
        timer = setTimeout(() => {
          armed = false;
          btn.textContent = '삭제';
          btn.classList.remove('armed');
        }, 4000);
        return;
      }
      clearTimeout(timer);
      btn.disabled = true;
      btn.textContent = '삭제 중...';
      try {
        const res = await fetch('/api/board/admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: ADMIN_PW, action: 'delete', id: btn.getAttribute('data-id') })
        });
        const data = await res.json();
        if (data.success) {
          loadPosts();
        } else {
          btn.disabled = false;
          btn.textContent = '삭제 실패';
          btn.classList.remove('armed');
        }
      } catch (e) {
        btn.disabled = false;
        btn.textContent = '삭제 실패';
        btn.classList.remove('armed');
      }
    });
  });

  postsEl.querySelectorAll('.replyBtn').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-id');
      const textarea = btn.previousElementSibling;

      // 등록된 답변이 있으면 수정칸을 접어둔다(읽기용 답변과 중복돼 보이지 않도록).
      // 첫 클릭은 펼치기, 그 다음 클릭에 저장한다.
      if (textarea.style.display === 'none') {
        textarea.style.display = '';
        textarea.focus();
        btn.textContent = '저장';
        return;
      }

      const reply = textarea.value.trim();
      if (!reply) return;
      btn.disabled = true;
      btn.textContent = '등록 중...';
      try {
        const res = await fetch('/api/board/admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: ADMIN_PW, action: 'reply', id, reply })
        });
        const data = await res.json();
        if (data.success) {
          loadPosts();
        } else {
          alert('답변 등록에 실패했습니다.');
          btn.disabled = false;
          btn.textContent = '저장';
        }
      } catch (e) {
        alert('오류가 발생했습니다.');
        btn.disabled = false;
        btn.textContent = '저장';
      }
    });
  });
}

async function loadPosts() {
  const res = await fetch('/api/board/admin', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: ADMIN_PW, action: 'list' })
  });
  const data = await res.json();
  if (data.success) renderPosts(data.posts);
}

refreshBtn.addEventListener('click', loadPosts);

// ─────────────── 단행본 출간 알림 신청 명단 ───────────────
const notifyListEl = document.getElementById('notifyList');
const notifyEmpty = document.getElementById('notifyEmpty');
const notifyCount = document.getElementById('notifyCount');
const mailsBox = document.getElementById('mailsBox');
let NOTIFY_ROWS = [];

function renderNotify(rows) {
  NOTIFY_ROWS = rows || [];
  notifyCount.textContent = NOTIFY_ROWS.length ? '· ' + NOTIFY_ROWS.length + '명' : '';
  if (!NOTIFY_ROWS.length) {
    notifyListEl.innerHTML = '';
    notifyEmpty.style.display = 'block';
    return;
  }
  notifyEmpty.style.display = 'none';
  notifyListEl.innerHTML =
    '<table style="width:100%; border-collapse:collapse; font-size:13.5px;">' +
    '<thead><tr style="color:#8b93a8; font-size:12px; text-align:left;">' +
    '<th style="padding:7px 8px;">이메일</th><th style="padding:7px 8px;">이름</th>' +
    '<th style="padding:7px 8px;">유입</th><th style="padding:7px 8px;">신청일</th>' +
    '<th style="padding:7px 8px;"></th></tr></thead><tbody>' +
    NOTIFY_ROWS.map(function (r) {
      return '<tr style="border-top:1px solid #2a2e3a;">' +
        '<td style="padding:8px;">' + esc(r.email) + '</td>' +
        '<td style="padding:8px; color:#c7ccdb;">' + esc(r.name || '—') + '</td>' +
        '<td style="padding:8px; color:#8b93a8;">' + esc(r.source || '—') + '</td>' +
        '<td style="padding:8px; color:#8b93a8; white-space:nowrap;">' + fmtDate(r.created_at) + '</td>' +
        '<td style="padding:8px; text-align:right;"><button class="nDelBtn" data-id="' + r.id +
        '" style="background:#3a1f24; width:auto; padding:5px 11px; font-size:12px;">삭제</button></td>' +
        '</tr>';
    }).join('') + '</tbody></table>';

  notifyListEl.querySelectorAll('.nDelBtn').forEach(function (btn) {
    btn.addEventListener('click', async function () {
      // 신청자 삭제는 되돌릴 수 없다. 수신 거부 요청을 처리할 때만 쓴다.
      if (!confirm('이 신청자를 삭제할까요? 되돌릴 수 없습니다.')) return;
      btn.disabled = true;
      const res = await fetch('/api/board/admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: ADMIN_PW, action: 'notify_delete', id: btn.getAttribute('data-id') })
      });
      const d = await res.json();
      if (d.success) loadNotify(); else { alert('삭제하지 못했습니다.'); btn.disabled = false; }
    });
  });
}

async function loadNotify() {
  const res = await fetch('/api/board/admin', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: ADMIN_PW, action: 'notify_list' })
  });
  const data = await res.json();
  if (data.success) renderNotify(data.notify);
}

document.getElementById('notifyRefreshBtn').addEventListener('click', loadNotify);

// 클립보드 API는 http 로 열거나 권한이 없으면 조용히 실패한다.
// 그래서 텍스트 상자에도 함께 뿌려 둔다 — 복사가 안 되면 눈으로 긁어갈 수 있다.
document.getElementById('copyMailsBtn').addEventListener('click', function () {
  if (!NOTIFY_ROWS.length) { alert('신청자가 없습니다.'); return; }
  const text = NOTIFY_ROWS.map(function (r) { return r.email; }).join(', ');
  mailsBox.value = text;
  mailsBox.style.display = 'block';
  try {
    navigator.clipboard.writeText(text).then(function () {
      alert(NOTIFY_ROWS.length + '개 주소를 복사했습니다.');
    }, function () { mailsBox.select(); });
  } catch (e) { mailsBox.select(); }
});
</script>
</body>
</html>
